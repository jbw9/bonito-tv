<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>Jam</title>
  <style>
    :root {
      --bg: #0e0f12;
      --panel: #181a1f;
      --panel-2: #22252b;
      --line: #2a2d34;
      --ink: #f4f6f8;
      --muted: #8b919a;
      --green: #1db954;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
    main { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

    .top {
      position: sticky; top: 0; z-index: 2;
      padding: calc(14px + env(safe-area-inset-top)) 0 12px;
      background: linear-gradient(var(--bg) 80%, transparent);
    }
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: .12em; }
    .brand h1 span { color: var(--green); }
    .tv { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    .tv i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .tv.on i { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .search { position: relative; }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    input {
      width: 100%; border: 1px solid var(--line); border-radius: 14px;
      background: var(--panel); color: var(--ink); font: inherit; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    input:focus { border-color: var(--green); }
    #query { padding: 15px 44px; font-size: 17px; }
    #clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border: 0; border-radius: 50%;
      background: var(--panel-2); color: var(--muted); font-size: 18px; line-height: 1; display: none;
    }
    #name { margin-top: 8px; padding: 10px 14px; font-size: 14px; background: transparent; }

    .now { position: relative; margin-top: 8px; border-radius: 20px; overflow: hidden; background: var(--panel); }
    .now .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.4); opacity: .55; }
    .now .inner { position: relative; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .now img { width: min(64vw, 260px); aspect-ratio: 1; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); object-fit: cover; background: var(--panel-2); }
    .label { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .now .label { margin: 16px 0 4px; color: rgba(255,255,255,.75); }
    .now .title { font-size: 22px; font-weight: 700; }
    .now .artist { color: rgba(255,255,255,.75); }
    .idle { padding: 36px 20px; text-align: center; color: var(--muted); }

    .chips { display: flex; gap: 8px; margin: 14px 0 4px; overflow-x: auto; }
    .chip {
      flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
      background: var(--panel); color: var(--ink); font: inherit; font-size: 14px;
    }

    h2 { margin: 24px 0 6px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    li + li { border-top: 1px solid var(--line); }
    li img, li .art { width: 48px; height: 48px; border-radius: 8px; background: var(--panel-2); flex: none; object-fit: cover; }
    .meta { flex: 1; min-width: 0; }
    .meta .name, .meta .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta .sub { color: var(--muted); font-size: 14px; }
    .by { color: var(--green); }
    .add {
      flex: none; min-width: 64px; height: 36px; padding: 0 14px; border: 0; border-radius: 999px;
      background: var(--green); color: #04120a; font: inherit; font-size: 14px; font-weight: 700;
    }
    .add:disabled { opacity: .6; }
    .add.done { background: transparent; color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    .add.failed { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
    .skeleton li .art, .skeleton .bar { animation: pulse 1.2s ease-in-out infinite; }
    .skeleton .bar { height: 12px; border-radius: 6px; background: var(--panel-2); margin: 6px 0; }
    @keyframes pulse { 50% { opacity: .45; } }
    .note { color: var(--muted); padding: 18px 0; text-align: center; }
    .note.error { color: var(--red); }

    #toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: transform .25s ease, opacity .25s ease;
      max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px;
      background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { transform: translate(-50%, 0); opacity: 1; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="brand">
        <h1>JAM<span>.</span></h1>
        <div class="tv" id="tv"><i></i><span>Connecting</span></div>
      </div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="query" type="search" maxlength="200" placeholder="Add a song" enterkeyhint="search" autocomplete="off" autocorrect="off">
        <button id="clear" aria-label="Clear">×</button>
      </div>
      <input id="name" maxlength="24" placeholder="Your name (optional)" autocomplete="nickname">
    </div>
    <div id="home"></div>
    <div id="results" hidden></div>
  </main>
  <div id="toast"></div>
  <script>
    // Guests' side of the launcher's jam (app/js/jam.js). Requests are rows in the
    // Supabase table `jam`; the TV answers each one, and keeps a 'state' row with the
    // queue. The publishable key is meant to be public.
    const SUPABASE = 'https://jbvkjvdthuzofvmhwctv.supabase.co';
    const KEY = 'sb_publishable_hbxcjbYF5H8py5gGLokxPg_tD9nGsNl';
    const ROOM = 'HOME';
    const REST = SUPABASE + '/rest/v1/';
    const $ = id => document.getElementById(id);
    let state = null, searchSeq = 0, debounce = null, toastTimer = null;

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function art(url) {
      const e = el(url ? 'img' : 'div', 'art');
      if (url) { e.src = url; e.alt = ''; e.loading = 'lazy'; }
      return e;
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
    }

    function insert(row) {
      return fetch(REST + 'jam', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify(Object.assign({ code: ROOM }, row)),
      }).then(r => {
        if (!r.ok) throw new Error("Couldn't reach the jam.");
        return r.json();
      }).then(rows => rows[0].id);
    }

    // The TV checks for requests every second and writes its answer to `results`.
    function answer(id) {
      const started = Date.now();
      return new Promise((resolve, reject) => {
        (function check() {
          fetch(REST + 'jam?select=results&id=eq.' + id, { headers: { apikey: KEY } })
            .then(r => r.json())
            .then(rows => {
              const res = rows[0] && rows[0].results;
              if (res && res.error) return reject(new Error(res.error));
              if (res) return resolve(res);
              if (Date.now() - started > 12000) return reject(new Error("The TV isn't answering. Is the launcher open?"));
              setTimeout(check, 400);
            }, reject);
        })();
      });
    }

    function guestName() {
      return $('name').value.trim().slice(0, 24) || null;
    }

    function addButton(t) {
      const btn = el('button', 'add', 'Add');
      btn.onclick = () => {
        btn.disabled = true;
        btn.textContent = '…';
        insert({ kind: 'add', query: t.uri, name: guestName(), title: (t.name + ' - ' + t.artist).slice(0, 200) })
          .then(answer)
          .then(() => {
            btn.textContent = 'Added';
            btn.className = 'add done';
            toast(t.name + ' is in the queue');
            setTimeout(loadState, 1500);
          }, err => {
            btn.disabled = false;
            btn.textContent = 'Retry';
            btn.className = 'add failed';
            toast(err.message);
          });
      };
      return btn;
    }

    function trackRow(t, withAdd) {
      const li = el('li');
      const meta = el('div', 'meta');
      meta.append(el('div', 'name', t.name));
      const sub = el('div', 'sub', t.artist);
      if (t.by) {
        sub.append(' · ');
        sub.append(el('span', 'by', 'added by ' + t.by));
      }
      meta.append(sub);
      li.append(art(t.image), meta);
      if (withAdd) li.append(addButton(t));
      return li;
    }

    function renderHome() {
      const home = $('home');
      home.textContent = '';
      const now = state && state.now;
      const box = el('div', 'now');
      if (now) {
        const blur = el('div', 'blur');
        if (now.image) blur.style.backgroundImage = 'url("' + now.image + '")';
        const inner = el('div', 'inner');
        inner.append(art(now.image), el('div', 'label', 'Now playing'), el('div', 'title', now.name), el('div', 'artist', now.artist));
        box.append(blur, inner);
      } else {
        box.append(el('div', 'idle', tvOn() ? 'Nothing playing yet. Add a song to start.' : 'The TV is off. Songs can be added once the launcher is open.'));
      }
      home.append(box);

      if (now && now.artist) {
        const chips = el('div', 'chips');
        const more = el('button', 'chip', 'More from ' + now.artist);
        more.onclick = () => { $('query').value = 'artist:"' + now.artist + '"'; onQuery(true); };
        chips.append(more);
        home.append(chips);
      }

      const next = (state && state.next) || [];
      if (next.length) {
        home.append(el('h2', 'label', 'Up next'));
        const ul = el('ul');
        next.forEach(t => ul.append(trackRow(t, false)));
        home.append(ul);
      }
    }

    function tvOn() {
      // The TV rewrites its state at least once a minute while the launcher is open.
      return !!(state && state.at && Date.now() - state.at < 150000);
    }

    function loadState() {
      return fetch(REST + 'jam?select=results&kind=eq.state&code=eq.' + ROOM, { headers: { apikey: KEY } })
        .then(r => r.json())
        .then(rows => {
          const next = rows[0] && rows[0].results;
          const changed = JSON.stringify(next) !== JSON.stringify(state);
          state = next || null;
          const on = tvOn();
          $('tv').className = on ? 'tv on' : 'tv';
          $('tv').lastChild.textContent = on ? 'TV on' : 'TV off';
          if (changed) renderHome();
        })
        .catch(() => {});
    }

    function skeleton() {
      const ul = el('ul', 'skeleton');
      for (let i = 0; i < 5; i++) {
        const li = el('li');
        const meta = el('div', 'meta');
        const a = el('div', 'bar'), b = el('div', 'bar');
        a.style.width = (50 + Math.random() * 30) + '%';
        b.style.width = (25 + Math.random() * 20) + '%';
        meta.append(a, b);
        li.append(el('div', 'art'), meta);
        ul.append(li);
      }
      return ul;
    }

    // Live search: results follow what's typed; only the latest search is shown.
    function onQuery(now) {
      const q = $('query').value.trim();
      $('clear').style.display = q ? 'block' : 'none';
      $('home').hidden = !!q;
      $('results').hidden = !q;
      clearTimeout(debounce);
      if (!q) return;
      const seq = ++searchSeq;
      if (!$('results').querySelector('ul:not(.skeleton)')) {
        $('results').textContent = '';
        $('results').append(skeleton());
      }
      debounce = setTimeout(() => {
        insert({ kind: 'search', query: q })
          .then(answer)
          .then(tracks => {
            if (seq !== searchSeq) return;
            const box = $('results');
            box.textContent = '';
            if (!tracks.length) return box.append(el('div', 'note', 'No songs found.'));
            const ul = el('ul');
            tracks.forEach(t => ul.append(trackRow(t, true)));
            box.append(ul);
          }, err => {
            if (seq !== searchSeq) return;
            $('results').textContent = '';
            $('results').append(el('div', 'note error', err.message));
          });
      }, now === true ? 0 : 350);
    }

    $('query').addEventListener('input', onQuery);
    $('query').addEventListener('keydown', e => { if (e.key === 'Enter') { $('query').blur(); onQuery(true); } });
    $('clear').onclick = () => { $('query').value = ''; onQuery(); $('query').focus(); };
    try { $('name').value = localStorage.getItem('jam-name') || ''; } catch (e) {}
    $('name').addEventListener('input', () => {
      try { localStorage.setItem('jam-name', $('name').value.trim()); } catch (e) {}
    });

    renderHome();
    loadState();
    setInterval(loadState, 3000);
  </script>
</body>
</html>
